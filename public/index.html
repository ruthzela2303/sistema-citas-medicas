<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Médico - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="login-container">
        <section class="login-card">
            <!-- Ícono decorativo médico -->
            <div class="medical-logo">🏥</div>
            <h2>Portal Médico</h2>
            <p>Ingresa tus credenciales para acceder al sistema de citas</p>
            
            <form class="login-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" required placeholder="ejemplo@clinica.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" required placeholder="********">
                </div>
                
                <button type="submit" class="btn-primary">Ingresar al Sistema</button>
            </form>
        </section>
    </main>

    <!-- Enlace al archivo de interactividad que usaremos luego -->
    <script src="js/main.js"></script>
</body>
</html>
