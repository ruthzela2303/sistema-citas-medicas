<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Clínico - Sistema de Citas</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        * { box-sizing: border-box; }
        body { overflow-x: hidden; margin:0; }
        body, main, section, div, tr, td, h2, h3, h4, p, select, input, button { transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        body.dark-mode { background-color: #0f172a!important; color: #f8fafc!important; }
        body.dark-mode.stat-card, body.dark-mode #vista-paciente, body.dark-mode #vista-administrador { background-color: #1e293b!important; color: #f8fafc!important; }
        body.dark-mode h2, body.dark-mode h3, body.dark-mode h4 { color: #38bdf8!important; }
        body.dark-mode p, body.dark-mode td, body.dark-mode th { color: #cbd5e1!important; }
        body.dark-mode input, body.dark-mode select { background-color: #334155!important; color: #fff!important; border-color: #475569!important; }
        @media (max-width: 768px) {
        .navbar { flex-wrap: wrap!important; padding: 15px!important; justify-content: center!important; gap: 12px!important; }
        .navbar h1 { width: 100%!important; text-align: center!important; font-size: 1.15rem!important; }
        .user-info { width: 100%!important; justify-content: center!important; flex-wrap: wrap!important; }
        .dashboard-container { margin-top: 195px!important; padding: 0 12px!important; width: 100%!important; max-width: 100%!important; }
        .stats-container { flex-direction: column!important; }
        .stat-card { min-width: 100%!important; }
         #vista-paciente, #vista-administrador { padding: 20px 12px!important; }
        }
    </style>
</head>
<body>
    <header class="navbar" style="background-color: #1e3a8a; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: fixed; width: 100%; top: 0; z-index: 1000; box-sizing: border-box;">
        <h1 style="font-size: 1.4rem;">🏥 Portal Clínico Sanitas</h1>
        <div class="user-info" style="display: flex; align-items: center; gap: 20px;">
            <button id="btn-theme" style="background: none; border: 1px solid white; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600;">🌙 Modo Oscuro</button>
            <span id="user-name" style="font-weight: 600;">Cargando...</span>
            <a href="index.html" id="btn-logout" style="color: #f87171; text-decoration: none; font-weight: 600; border: 1px solid #f87171; padding: 6px 12px; border-radius: 6px;">Cerrar Sesión</a>
        </div>
    </header>
    <main class="dashboard-container" style="max-width: 1200px; margin: 195px auto 40px; padding: 0 20px;">
        <section class="welcome-section" style="margin-bottom: 30px;">
            <h2 id="dashboard-title" style="color: #1e3a8a; font-size: 1.8rem; margin-bottom: 5px;">Panel de Control</h2>
            <p id="dashboard-subtitle" style="color: #64748b;">Cargando información...</p>
        </section>
        <section class="stats-container" style="display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 30px;">
            <div class="stat-card" style="background: white; padding: 20px; border-radius: 12px; display: flex; align-items: center; gap: 20px; flex: 1; min-width: 250px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border-left: 5px solid #2563eb;">
                <div style="font-size: 2.2rem; background: #f0f4f8; padding: 10px; border-radius: 50%;">👨‍⚕️</div>
                <div><h3 id="stat-medicos" style="font-size: 1.6rem; color: #1e293b;">0</h3><p style="color: #64748b; font-size: 0.85rem;">Especialistas Activos</p></div>
            </div>
            <div class="stat-card" style="background: white; padding: 20px; border-radius: 12px; display: flex; align-items: center; gap: 20px; flex: 1; min-width: 250px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border-left: 5px solid #10b981;">
                <div style="font-size: 2.2rem; background: #f0f4f8; padding: 10px; border-radius: 50%;">📅</div>
                <div><h3 id="stat-citas" style="font-size: 1.6rem; color: #1e293b;">0</h3><p style="color: #64748b; font-size: 0.85rem;">Total de Citas del Hospital</p></div>
            </div>
        </section>
        <section id="vista-paciente" style="display: none; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);">
            <h3 style="color: #1e3a8a; margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px;">📅 Agendar una Nueva Cita Médica</h3>
            <form id="form-reserva" style="display: flex; flex-direction: column; gap: 20px;">
                <div style="display: flex; flex-direction: column; gap: 5px;"><label style="font-weight: 600; font-size: 0.9rem; color: #334155;">1. Selecciona el Especialista Médico:</label><select id="select-medico" required style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;"></select></div>
                <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                    <div style="display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 200px;"><label style="font-weight: 600; font-size: 0.9rem;">2. Elige la Fecha:</label><input type="date" id="fecha-cita" required style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;"></div>
                    <div style="display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 200px;"><label style="font-weight: 600; font-size: 0.9rem;">3. Elige el Horario:</label><select id="hora-cita" required style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;"><option value="08:00:00">08:00 AM</option><option value="09:00:00">09:00 AM</option><option value="10:00:00">10:00 AM</option><option value="11:00:00">11:00 AM</option><option value="15:00:00">03:00 PM</option><option value="16:00:00">04:00 PM</option></select></div>
                </div>
                <button type="submit" style="background: #2563eb; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 600; cursor: pointer;">Confirmar Reserva Médica</button>
            </form>
            <div style="margin-top: 35px; border-top: 2px solid #f1f5f9; padding-top: 20px;"><h3 style="color: #1e3a8a; margin-bottom: 15px;">📋 Mis Citas Programadas para Hoy</h3><div id="mis-citas-hoy-lista" style="display: flex; flex-direction: column; gap: 15px;"></div></div>
        </section>
        <section id="vista-administrador" style="display: none; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);">
            <h3 style="color: #1e3a8a; margin-bottom: 20px;">📋 Control de Citas Médicas</h3>
            <div class="search-container" style="margin: 20px 0;"><input type="text" id="search-input" placeholder="🔍 Buscar por nombre de paciente, médico o especialidad..." style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;"></div>
            <div style="text-align: right; margin-bottom: 20px;"><button id="btn-exportar-pdf" style="background-color: #10b981; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer;">📥 Descargar Reporte (PDF)</button></div>
            <table style="width: 100%; border-collapse: collapse; text-align: left;"><thead><tr style="background: #f8fafc; border-bottom: 2px solid #e2e8f0;"><th style="padding: 12px;">Paciente</th><th style="padding: 12px;">Médico</th><th style="padding: 12px;">Fecha / Hora</th><th style="padding: 12px;">Estado</th></tr></thead><tbody id="tabla-citas-body"></tbody></table>
        </section>
    </main>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const idUsuario = localStorage.getItem('usuario_id');
    const nombreUsuario = localStorage.getItem('usuario_nombre');
    const rolUsuario = localStorage.getItem('usuario_rol');
    document.getElementById('btn-logout').addEventListener('click', () => { localStorage.clear(); });
    const btnTheme = document.getElementById('btn-theme');
    const currentTheme = localStorage.getItem('theme');
    if (currentTheme === 'dark') { document.body.classList.add('dark-mode'); if (btnTheme) btnTheme.textContent = '☀️ Modo Claro'; }
    if (btnTheme) {
        btnTheme.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) { localStorage.setItem('theme', 'dark'); btnTheme.textContent = '☀️ Modo Claro'; }
            else { localStorage.setItem('theme', 'light'); btnTheme.textContent = '🌙 Modo Oscuro'; }
        });
    }
    if (!nombreUsuario ||!rolUsuario) { alert('Acceso restringido. Por favor, inicia sesión.'); window.location.href = 'index.html'; return; }
    document.getElementById('user-name').textContent = `Bienvenido, ${nombreUsuario} (${rolUsuario})`;
    cargarEstadisticasClinica();
    if (rolUsuario === 'administrador') {
        document.getElementById('dashboard-title').textContent = 'Panel de Administración Médica';
        document.getElementById('dashboard-subtitle').textContent = 'Monitoreo global de la ocupación de consultorios.';
        document.getElementById('vista-administrador').style.display = 'block';
        cargarCitasGlobalesAdmin(); configurarBuscadorAdmin(); configurarBotonPDF();
    } else {
        document.getElementById('dashboard-title').textContent = 'Portal del Paciente';
        document.getElementById('dashboard-subtitle').textContent = 'Gestiona tus citas y reserva horarios.';
        document.getElementById('vista-paciente').style.display = 'block';
        cargarMedicosDesplegable(); configurarFormularioReserva(idUsuario); cargarMisCitasHoy(idUsuario);
    }
});
async function cargarEstadisticasClinica() { try { const r = await fetch('/api/estadisticas-medicas'); const d = await r.json(); if (d.success) { document.getElementById('stat-medicos').textContent = d.totalMedicos; document.getElementById('stat-citas').textContent = d.totalCitasHoy; } } catch(e){} }
async function cargarMedicosDesplegable() { try { const r = await fetch('/api/medicos'); const d = await r.json(); const s = document.getElementById('select-medico'); if(!s)return; s.innerHTML='<option value="">-- Seleccione un Especialista --</option>'; if(d.success){ d.medicos.forEach(m=>{ s.innerHTML+=`<option value="${m.id}">${m.nombre} - ${m.especialidad} (${m.consultorio})</option>`; }); } } catch(e){} }
function configurarFormularioReserva(idP){ const f=document.getElementById('form-reserva'); if(!f)return; f.addEventListener('submit', async (e)=>{ e.preventDefault(); const idM=document.getElementById('select-medico').value; const fecha=document.getElementById('fecha-cita').value; const hora=document.getElementById('hora-cita').value; if(!idM){ alert('Selecciona un especialista'); return; } try{ const r=await fetch('/api/matricular-cita',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id_paciente:idP,id_medico:idM,fecha,hora})}); const d=await r.json(); alert(d.message); if(d.success){ f.reset(); cargarEstadisticasClinica(); cargarMisCitasHoy(idP); } }catch(e){ alert('Error de red'); } }); }
async function cargarCitasGlobalesAdmin(){ try{ const r=await fetch('/api/citas-globales'); const d=await r.json(); const tbody=document.getElementById('tabla-citas-body'); if(!tbody)return; tbody.innerHTML=''; if(d.success && d.citas.length>0){ d.citas.forEach(c=>{ const f=c.fecha.includes('T')?c.fecha.split('T')[0]:c.fecha; tbody.innerHTML+=`<tr style="border-bottom:1px solid #e2e8f0"><td style="padding:15px" colspan="4">👤 <strong>${c.paciente||c.paciente_nombre}</strong> (${c.medico||c.medico_nombre}) <br>🩺 ${c.especialidad||c.medico_especialidad} | 📅 ${f} | ⏰ ${c.hora} <br><select class="select-estado" data-id="${c.id}" style="padding:4px 8px;border-radius:6px;margin-top:5px"><option value="pendiente" ${c.estado==='pendiente'?'selected':''}>⏳ Pendiente</option><option value="completada" ${c.estado==='completada'?'selected':''}>✅ Se Atendió</option><option value="cancelada" ${c.estado==='cancelada'?'selected':''}>❌ No Asistió</option></select></td></tr>`; }); escucharCambiosEstado(); } else { tbody.innerHTML='<tr><td colspan="4" style="text-align:center;padding:25px">No hay citas</td></tr>'; } }catch(e){} }
function escucharCambiosEstado(){ document.querySelectorAll('.select-estado').forEach(s=>{ s.addEventListener('change', async (e)=>{ const id=e.target.getAttribute('data-id'); const est=e.target.value; try{ const r=await fetch('/api/actualizar-estado-cita',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id_cita:id,nuevo_estado:est})}); const d=await r.json(); alert(d.message); if(d.success)cargarEstadisticasClinica(); }catch(e){} }); }); }
function configurarBuscadorAdmin(){ const inp=document.getElementById('search-input'); if(!inp)return; inp.addEventListener('input',(e)=>{ const t=e.target.value.toLowerCase(); document.querySelectorAll('#tabla-citas-body tr').forEach(row=>{ row.style.display=row.textContent.toLowerCase().includes(t)?'':'none'; }); }); }
async function cargarMisCitasHoy(idP){ try{ const r=await fetch(`/api/mis-citas-hoy/${idP}`); const d=await r.json(); const cont=document.getElementById('mis-citas-hoy-lista'); if(!cont)return; cont.innerHTML=''; if(d.success && d.citas.length>0){ d.citas.forEach(c=>{ cont.innerHTML+=`<div style="background:#f0fdf4;border:1px solid #bbf7d0;padding:15px;border-radius:10px;border-left:5px solid #10b981;display:flex;justify-content:space-between;align-items:center"><div><h4 style="color:#14532d">👨‍⚕️ ${c.medico}</h4><p>🩺 ${c.especialidad}</p><p>📅 ${c.fecha} | ⏰ ${c.hora}</p></div><span style="background:#10b981;color:white;padding:6px 12px;border-radius:6px;font-size:0.8rem">${c.estado}</span></div>`; }); } else { cont.innerHTML=`<p style="text-align:center;padding:20px;background:#f8fafc;border-radius:8px">🏖️ No tienes citas hoy</p>`; } }catch(e){} }
function configurarBotonPDF(){ const btn=document.getElementById('btn-exportar-pdf'); if(!btn)return; btn.addEventListener('click',()=>{ const nav=document.querySelector('.navbar'); const welcome=document.querySelector('.welcome-section'); const stats=document.querySelector('.stats-container'); const search=document.querySelector('.search-container'); if(nav)nav.style.display='none'; if(welcome)welcome.style.display='none'; if(stats)stats.style.display='none'; if(search)search.style.display='none'; btn.style.display='none'; window.print(); setTimeout(()=>{ if(nav)nav.style.display='flex'; if(welcome)welcome.style.display='block'; if(stats)stats.style.display='flex'; if(search)search.style.display='block'; btn.style.display='inline-block'; },500); }); }
</script>
</body>
</html>
